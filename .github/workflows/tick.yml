name: 定时闹钟

# 主闹钟：保留原有的多档低频 cron（精确档 + 每 3/4/5 小时错峰）。
# 判定与叫醒逻辑已抽到 alarm.yml（单一真源）—— 今天正是被"同一段判重逻辑散落三处"坑的。
on:
  schedule:
    - cron: '9 2,6,10,14 * * 1-5'   # 4 档精确位：北京冬令 10:09/14:09/18:09/22:09（夏令各早 1h）
    #   ★ 2026-11-10 补：原为 `9 6,10,14`，**缺北京 10:05 那档**（ET 21:05 = UTC 02:05）。
    #     11-09 晚 22:05 档就是因此没被叫醒（加上 14:09 那次没投递），拖到 00:23 才补发。
    #   加 `1-5`：UTC 周一 02:09 = ET 周日 21:09 仍在周一生效；周五 14:09 = ET 周五 09:09 仍生效。
    - cron: '23 */4 * * *'      # 每 4 小时
    - cron: '37 */3 * * *'      # 每 3 小时（错峰）
    - cron: '53 */5 * * *'      # 每 5 小时（错峰）
  workflow_dispatch: {}

jobs:
  tick:
    uses: ./.github/workflows/alarm.yml
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
