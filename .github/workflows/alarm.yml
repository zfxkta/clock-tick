name: 闹钟核心（可复用）

# ── 为什么拆成可复用工作流 ──
# 2026-10-19 实测规律：**同一个仓库里，cron 越密投递率越低** ——
#   gold-eye `*/30`（48 次/天）→ 实际只投递 12%
#   probe     `23 */4`（6 次/天）→ 实际投递 67%
# 而今天真正的故障是：13:23~19:07 有 **344 分钟完全没有唤醒**，14:09 档正好掉在里面。
# ⇒ 解法不是"把一个工作流调更密"（会掉投递率），而是"**很多个低频工作流**"，
#   每个只响几次/天 → 各自保住高投递率，合起来把全天铺满。
# 逻辑只写在这里一份，clock-*.yml 只负责各自的 cron（避免"同一段逻辑散落 6 处"）。

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 叫醒金瞳（该跑才叫）
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e
          # ★ v5.9: 档位以【纽约时间】定义 → 自动跟随夏令时（与 gold-eye gate 同源）
          export TZ=America/New_York
          API="https://api.github.com/repos/zfxkta/gold-eye/actions/workflows/gold-eye.yml"

          fire() {
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              "$API/dispatches" -d '{"ref":"main"}')
            echo "  → 触发请求已发送，HTTP $code"
          }

          if [ -z "$GH_PAT" ]; then echo "::error::未配置 GH_PAT"; exit 1; fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发 → 无条件叫醒"; fire; exit 0
          fi

          DOW=$(date +%u)
          # ★★ 2026-11-09 修：旧写法 `[ "$DOW" -gt 5 ]` 把**周日 21:10 档**一起跳掉了。
          #   现货黄金 ET 周日 18:00 就开盘，18:00→21:00 那根是真 bar
          #   ⇒ 这一行让**北京周一 10:05 档每周必然缺**，再由 gate 的「补最早未跑档」
          #   把整条链拖慢一档（流水实证每档晚 4.0~4.7 小时）。
          #   改成与 gold-eye gate 的 _market_open 逐字同口径：
          #   周六全休 / 周日 18:00 前 / 周五 17:00 后。仍用 ET ⇒ 自动跟随夏令时。
          NOWMIN=$((10#$(date +%H) * 60 + 10#$(date +%M)))
          if [ "$DOW" -eq 6 ]; then echo "周六（黄金市场休市）→ 不叫"; exit 0; fi
          if [ "$DOW" -eq 7 ] && [ "$NOWMIN" -lt 1080 ]; then
            echo "周日 18:00 前（休市）→ 不叫"; exit 0
          fi
          if [ "$DOW" -eq 5 ] && [ "$NOWMIN" -ge 1020 ]; then
            echo "周五 17:00 后（休市）→ 不叫"; exit 0
          fi

          # ★★ 2026-11-09：档位 3 → 4，与 gate 的 SLOTS 逐字同源（65 305 545 1265）。
          #   旧版只有 70/310/550（ET 01:10/05:10/09:10），**缺 ET 21:05**
          #   = 北京 10:05（冬令）/ 13:05（夏令）那一档 —— 也就是说 11-05 把档位从 3 扩到 4 时，
          #   gate 与 schedule-probe 都改了，唯独这个闹钟没跟 ⇒ 那一档**从来没被叫醒过**。
          #   ⚠️ 为什么用 :05 而不是原来的 :10：这个变量同时充当「档位时刻」判据
          #      （下面 `LATEST_TS >= TARGET_TS`）。写 :10 会让准点跑完（ledger 约 +2min）
          #      仍被判成"未跑" ⇒ 每次多叫一次，白烧额度。
          NOWMIN=$((10#$(date +%H) * 60 + 10#$(date +%M)))
          TARGET=""
          for S in 65 305 545; do [ "$NOWMIN" -ge "$S" ] && TARGET=$S; done
          DAYOFF=0
          if [ -z "$TARGET" ]; then TARGET=545; DAYOFF=-1; fi
          TARGET_TS=$(( $(date -d "today 00:00" +%s) + DAYOFF * 86400 + TARGET * 60 ))
          echo "目标档位：$(TZ=Asia/Shanghai date -d @$TARGET_TS +'%F %H:%M') 北京时间（ET $(date -d @$TARGET_TS +'%H:%M')）"

          # ★ 只认「金瞳真跑过」的证据：gold-eye-bot 身份 + ledger: 前缀的提交。
          #   空转的 gate 运行（run job=skipped）也会留 run 记录，不能用来判重。
          LATEST=$(curl -sS -H "Authorization: Bearer $GH_PAT" -H "Accept: application/vnd.github+json" \
                     "https://api.github.com/repos/zfxkta/gold-eye/commits?per_page=50" \
                   | jq -r '[.[] | select(.commit.author.name=="gold-eye-bot") | select(.commit.message|startswith("ledger:"))][0].commit.committer.date // empty' 2>/dev/null || echo "")
          LATEST_TS=0
          [ -n "$LATEST" ] && LATEST_TS=$(date -d "$LATEST" +%s 2>/dev/null || echo 0)
          if [ "$LATEST_TS" -gt 0 ]; then
            echo "金瞳最近一次真跑：$(TZ=Asia/Shanghai date -d @$LATEST_TS +'%F %H:%M') 北京时间"
          else
            echo "金瞳最近一次真跑：查不到（按未跑处理）"
          fi

          if [ "$LATEST_TS" -ge "$TARGET_TS" ]; then
            echo "✅ 该档已真跑 → 不叫（防重复）"
          else
            echo "⚠️ 该档尚未真跑 → 叫醒金瞳"
            fire
          fi
