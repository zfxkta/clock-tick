name: 闹钟 C

# 只负责「自己的 cron」，判定与叫醒逻辑统一在 alarm.yml（单一真源）。
# 每个外壳只有 6 次/天 —— 低频才保得住投递率（见 alarm.yml 头部说明）。
# ★ v5.9 (2026-10-20): 档位改为 ET 01:10/05:10/09:10，自动跟随夏令时
#   ⇒ 唤醒点必须同时覆盖：UTC 5/9/13（夏令档 北京13/17/21）与 UTC 6/10/14（冬令档 北京14/18/22）。
on:
  schedule:
    - cron: '40 2,6,10,14,18,22 * * *'
  workflow_dispatch: {}

jobs:
  alarm:
    uses: ./.github/workflows/alarm.yml
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
